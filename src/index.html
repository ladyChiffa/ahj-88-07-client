<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>

<body>
<div class="main">

    <div class="controls">
            <div class="button button-add">Добавить тикет</div>
    </div>

    <div class="list-widget">
    </div>

    <div class="modal">
        <div class="modal-widget edit-widget">
            <div class="form-title">Добавить тикет</div>
            <form class="edit-form" id="edit-form">
                <label>Краткое описание</label>
                <input type="text" name="short-description">
                <label>Подробное описание</label>
                <textarea name="detailed-description"></textarea>
                <div class="controls">
                    <div class="button button-cancel">Отмена</div>
                    <div class="button button-submit">OK</div>
                </div>
            </form>
        </div>
    </div>

    <div class="modal">
        <div class="modal-widget delete-widget">
            <div class="form-title">Удалить тикет</div>
            <form class="delete-form">
                <div class="delete-details delete-data"></div>
                <div class="delete-details">Вы уверены, что хотите удалить тикет? Это действие необратимо.</div>
                <div class="controls">
                    <div class="button button-cancel">Отмена</div>
                    <div class="button button-submit">OK</div>
                </div>
            </form>
        </div>
    </div>

</div></body>

</html>
